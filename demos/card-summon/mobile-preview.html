<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>索隆 H5 · 手机预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 18px 36px; background: #eee9f7; color: #563471; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 414px; margin: 0 auto 20px; }
    h1 { margin: 0; font-size: 17px; font-weight: 500; }
    header p { margin: 6px 0 0; color: #8d7b9f; font-size: 11px; }
    a { color: #7f4aa5; font-size: 11px; text-decoration: none; white-space: nowrap; }
    .phone { width: 414px; max-width: 100%; margin: auto; padding: 10px; border: 2px solid #d0bfdc; border-radius: 35px; background: #fbf9ff; box-shadow: 0 24px 65px #5e347522; }
    iframe { display: block; width: 100%; height: 844px; border: 0; border-radius: 23px; background: #faf9ff; }
    @media (max-width: 440px) {
      body { padding: 0; }
      header { display: none; }
      .phone { width: 100%; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      iframe { height: 100svh; height: 100dvh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header><div><h1>索隆 · 手机 H5</h1><p>390 × 844 · 可直接操作</p></div><a href="standalone.html">打开完整页面 ↗</a></header>
  <main class="phone"><iframe src="standalone.html" title="索隆抽卡手机页面"></iframe></main>
</body>
</html>
